<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: #fff;
    background:
      radial-gradient(700px 600px at 15% 12%, rgba(168,85,247,.5), transparent 70%),
      radial-gradient(700px 600px at 90% 92%, rgba(20,184,166,.38), transparent 70%),
      radial-gradient(500px 420px at 88% 18%, rgba(236,72,153,.28), transparent 70%), #0b0a1d;
    display: flex; flex-direction: column; align-items: center; }
  .grad { background: linear-gradient(90deg,#a855f7,#ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .slot { width: 1080px; height: 608px; flex: none; }
  .logo img { display: block; }
  .vertical { width: 1080px; height: 1920px; }
  .vertical .top { height: 656px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 70px; box-sizing: border-box; }
  .vertical .logo img { height: 96px; }
  .vertical h1 { font-size: 96px; font-weight: 800; letter-spacing: -2px; line-height: 1.04; text-align: center; margin: 44px 0 0; }
  .vertical .bottom { height: 656px; display: flex; flex-direction: column; align-items: center; padding-top: 80px; box-sizing: border-box; }
  .vertical p { font-size: 44px; color: #c4b5fd; margin: 0; text-align: center; line-height: 1.35; }
  .vertical .url { margin-top: 64px; font-size: 58px; font-weight: 800; }
  .vertical .gh { margin-top: 14px; font-size: 32px; color: #a1a1c2; }
  .square { width: 1080px; height: 1080px; }
  .square .top { height: 236px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .square .logo img { height: 64px; }
  .square h1 { font-size: 54px; font-weight: 800; letter-spacing: -1px; margin: 18px 0 0; }
  .square .bottom { height: 236px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .square .url { font-size: 46px; font-weight: 800; }
  .square .gh { margin-top: 10px; font-size: 26px; color: #a1a1c2; }
</style></head>
<body>
  <div class="top"><div class="logo"><img src="LOGO_URL"></div><h1 class="headline"></h1></div>
  <div class="slot"></div>
  <div class="bottom"><p class="sub"></p><div class="url">free.quar.pro</div><div class="gh">Free &amp; open source · github.com/FunwayHQ/quar-animator</div></div>
<script>
  const format = location.hash.slice(1);
  document.body.className = format;
  document.querySelector('.headline').innerHTML = format === 'vertical'
    ? 'Animate in<br>your <span class="grad">browser.</span>'
    : 'Animate in your <span class="grad">browser.</span>';
  document.querySelector('.sub').innerHTML = format === 'vertical' ? 'Draw · animate · export<br>Lottie, GIF, MP4 &amp; SVG' : '';
</script>
</body></html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --violet: #a855f7; --pink: #ec4899; --teal: #14b8a6; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b0a1d; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    color: #fff;
    background:
      radial-gradient(900px 700px at 18% 22%, rgba(168, 85, 247, 0.45), transparent 70%),
      radial-gradient(800px 640px at 85% 80%, rgba(20, 184, 166, 0.35), transparent 70%),
      radial-gradient(600px 500px at 80% 15%, rgba(236, 72, 153, 0.25), transparent 70%),
      #0b0a1d;
    display: flex; align-items: center; justify-content: center;
  }
  .card { display: none; text-align: center; }
  body[data-card="intro"] .intro, body[data-card="outro"] .outro { display: block; }
  .logo { height: 120px; opacity: 0; transform: translateY(24px) scale(0.92); }
  .logo img { height: 120px; filter: drop-shadow(0 12px 40px rgba(168, 85, 247, 0.5)); }
  h1 { font-size: 112px; font-weight: 800; letter-spacing: -2px; margin: 36px 0 0; line-height: 1.05; }
  h1 span { display: inline-block; opacity: 0; transform: translateY(40px); }
  .grad { background: linear-gradient(90deg, var(--violet), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { font-size: 44px; color: #c4b5fd; margin: 28px 0 0; opacity: 0; transform: translateY(20px); }
  .chips { margin-top: 56px; display: flex; gap: 18px; justify-content: center; }
  .chip { font-size: 32px; padding: 14px 30px; border-radius: 999px; border: 2px solid rgba(196, 181, 253, 0.45); background: rgba(255, 255, 255, 0.06); opacity: 0; transform: translateY(20px); }
  .url { margin-top: 64px; font-size: 54px; font-weight: 700; opacity: 0; transform: translateY(20px); }
  .gh { margin-top: 18px; font-size: 32px; color: #a1a1c2; opacity: 0; }
  .go .logo { animation: up 0.9s cubic-bezier(.2,.9,.25,1.2) 0.1s forwards; }
  .go h1 span { animation: up 0.8s cubic-bezier(.2,.8,.2,1) forwards; }
  .go h1 span:nth-child(1) { animation-delay: 0.45s; }
  .go h1 span:nth-child(2) { animation-delay: 0.6s; }
  .go h1 span:nth-child(3) { animation-delay: 0.75s; }
  .go h1 span:nth-child(4) { animation-delay: 0.9s; }
  .go p { animation: up 0.8s ease-out 1.25s forwards; }
  .go .chip { animation: up 0.6s cubic-bezier(.2,.9,.25,1.3) forwards; }
  .go .chip:nth-child(1) { animation-delay: 0.9s; }
  .go .chip:nth-child(2) { animation-delay: 1.0s; }
  .go .chip:nth-child(3) { animation-delay: 1.1s; }
  .go .chip:nth-child(4) { animation-delay: 1.2s; }
  .go .url { animation: up 0.8s ease-out 1.6s forwards; }
  .go .gh { animation: up 0.8s ease-out 1.9s forwards; }
  @keyframes up { to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="card intro">
    <div class="logo"><img src="LOGO_URL" alt=""></div>
    <h1><span>Animate</span> <span>in</span> <span>your</span> <span class="grad">browser.</span></h1>
    <p>Draw, rig and animate — then export anywhere.</p>
  </div>
  <div class="card outro">
    <div class="logo"><img src="LOGO_URL" alt=""></div>
    <h1><span>Free</span> <span>&amp;</span> <span>open</span> <span class="grad">source.</span></h1>
    <div class="chips"><span class="chip">Lottie</span><span class="chip">GIF</span><span class="chip">MP4</span><span class="chip">SVG</span></div>
    <div class="url">free.quar.pro</div>
    <div class="gh">github.com/FunwayHQ/quar-animator</div>
  </div>
</body>
</html>

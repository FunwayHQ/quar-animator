<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pictures only from the editor itself or the document (data: and blob:
         URLs): one linked from elsewhere would tell that server who opened a
         project. No plugins, and no <base> to send relative links elsewhere. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="img-src 'self' data: blob:; object-src 'none'; base-uri 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QUAR Animator - Free, open-source 2D animation platform" />
    <meta name="theme-color" content="#0A0A0B" />
    <title>QUAR Animator</title>
    <!-- Fonts are self-hosted via @fontsource packages (no external requests) -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
